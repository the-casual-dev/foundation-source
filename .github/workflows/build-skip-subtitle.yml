name: build-skip-subtitle
on: [push, workflow_dispatch]
jobs:
  win64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DCMAKE_C_FLAGS="-std=gnu11 -fno-strict-aliasing"
          -DCMAKE_EXE_LINKER_FLAGS="-municode -static"
      - run: cmake --build build --target mkvalidator
      - uses: actions/upload-artifact@v4
        with:
          name: mkvalidator-win64
          path: build/**/mkvalidator.exe
